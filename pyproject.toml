[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-calendar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["icalendar>=6.0,<7", "requests>=2.32,<3", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
