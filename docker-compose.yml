services:
  nfl-calendar:
    build: .
    ports:
      - "8000:8000"
    environment:
      NFL_SEASON: "${NFL_SEASON:-2026}"
      OUTPUT_FILE: /tmp/nfl.ics
      EVENT_DURATION_FALLBACK_MINUTES: "${EVENT_DURATION_FALLBACK_MINUTES:-210}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-21600}"
